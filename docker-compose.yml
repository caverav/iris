version: "3.5"

# Iris deployment profiles:
#   iris            - core stack (DB, API, frontend, assembler, enricher, flagids)
#   suricata-ids    - Suricata in offline pcap-reading mode (default legacy behaviour)
#   suricata-ips    - Suricata inline via NFQUEUE on the host (blocks matched attacks)
#   vulnbox-agent   - rsync shipper for split-mode deployments
#
# Set COMPOSE_PROFILES in .env (default is `iris,suricata-ids`).
# On the vulnbox in split mode, override with `COMPOSE_PROFILES=suricata-ips,vulnbox-agent`.

x-suricata-common: &suricata-common
  build:
    context: suricata
  image: iris-suricata:latest
  restart: unless-stopped
  volumes:
    - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro
    - ${SURICATA_DIR_HOST}/log:/var/log/suricata
    - ${SURICATA_DIR_HOST}/etc:/etc/suricata
    - ${SURICATA_DIR_HOST}/lib:/var/lib/suricata
    # Suricata writes its unix-command socket here; api mounts the same
    # named volume so the Settings page can `suricatasc reload-rules`.
    - suricata-control:/run/suricata
  healthcheck:
    test: ["CMD-SHELL", "pgrep -x suricata >/dev/null"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  timescale:
    profiles: ["iris"]
    build: services/timescale
    image: iris-timescale:latest
    restart: unless-stopped
    volumes:
    - timescale-data:/var/lib/postgresql/data
    - ./services/schema/system.sql:/docker-entrypoint-initdb.d/100_system.sql:ro
    - ./services/schema/functions.sql:/docker-entrypoint-initdb.d/101_functions.sql:ro
    - ./services/schema/schema.sql:/docker-entrypoint-initdb.d/102_schema.sql:ro
    networks:
      - internal
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: iris
      POSTGRES_DB: iris
    # This does not need to be adjusted, unless you actually want to limit it
    # Postgres uses shared memory for caching, and docker assigns just 64 MB by default
    shm_size: '128g'

  frontend:
    profiles: ["iris"]
    build:
      context: frontend
      dockerfile: Dockerfile-frontend
    image: iris-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - 3000
    depends_on:
      - timescale
      - api
    networks:
      - internal
    environment:
      API_SERVER_ENDPOINT: http://api:5000/
      VIRTUAL_HOST: iris.h4xx.eu

  api:
    profiles: ["iris"]
    build:
      context: services/api
      dockerfile: Dockerfile-api
    image: iris-api:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro
      # Settings page edits local.rules; mount the rules dir rw so the api
      # can write into it. Same dir Suricata reads from at /var/lib/suricata.
      - ${SURICATA_DIR_HOST}/lib/rules:/suricata/rules:rw
      # suricatasc reload-rules talks to Suricata over its unix-command
      # socket; share the runtime dir so this socket is visible to api.
      - suricata-control:/run/suricata
      # SSH key embedded in the /admin/bootstrap response (split mode only).
      - ${IRIS_BOOTSTRAP_KEY_DIR:-./iris-setup/keys}:/run/iris-keys:ro
    environment:
      TIMESCALE: ${TIMESCALE}
      IRIS_TRAFFIC_DIR: ${TRAFFIC_DIR_DOCKER}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      VM_IP: ${VM_IP}
      IRIS_RULES_PATH: /suricata/rules/local.rules
      IRIS_SURICATA_SOCKET: /run/suricata/suricata-command.socket
      IRIS_ADMIN_USER: ${IRIS_ADMIN_USER:-}
      IRIS_ADMIN_PASS: ${IRIS_ADMIN_PASS:-}
      # /admin/bootstrap embeds these so a curl-piped install on a fresh
      # vulnbox knows how to ship back to us. Set on the analysis box only.
      IRIS_BOOTSTRAP_API_BASE: ${IRIS_BOOTSTRAP_API_BASE:-}
      IRIS_BOOTSTRAP_KEY_PATH: ${IRIS_BOOTSTRAP_KEY_PATH:-/run/iris-keys/id_ed25519}
      IRIS_REPO_URL: ${IRIS_REPO_URL:-https://github.com/caverav/iris.git}
      IRIS_REPO_REF: ${IRIS_REPO_REF:-master}
      VULNBOX_SSH_DEST: ${VULNBOX_SSH_DEST:-}

  flagids:
    profiles: ["iris"]
    restart: unless-stopped
    build:
      context: services/flagids
    image: iris-flagids:latest
    depends_on:
      - timescale
    networks:
      - internal
    environment:
      TIMESCALE: ${TIMESCALE}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCRAPE: ${FLAGID_SCRAPE}
      TEAM_ID: ${TEAM_ID}
      FLAGID_ENDPOINT: ${FLAGID_ENDPOINT}
      VISUALIZER_URL: ${VISUALIZER_URL}
      DUMP_PCAPS: ${DUMP_PCAPS}

  assembler:
    profiles: ["iris"]
    build:
      context: services/go-importer
      dockerfile: Dockerfile-assembler
    image: iris-assembler:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    # Command line flags most likely to fix an iris issue:
    # - -http-session-tracking: enable HTTP session tracking
    # - -dir: directory to read traffic from
    # - -skipchecksum: skip checksum validation
    # - -flush-after: close idle TCP conns and persist their flow rows after
    #   this duration. Required when Suricata-IPS drops mid-conversation
    #   packets - otherwise the flow never closes and never surfaces.
    # - -disable-converters: disable converters
    # - -max-flow-item-size: per-flow cap in MiB (default 16). Large HTTP
    #   payloads are truncated above this; a WARN is logged on the first
    #   truncation per stream. Raise the flag if your CTF has big artifacts.
    command: "./assembler -http-session-tracking -skipchecksum -disable-converters -flush-after 30s -dir ${TRAFFIC_DIR_DOCKER}"
    environment:
      TIMESCALE: ${TIMESCALE}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCAN: ${FLAGID_SCAN}
      FLAG_LIFETIME: ${FLAG_LIFETIME}
      FLAG_VALIDATOR_TYPE: ${FLAG_VALIDATOR_TYPE}
      FLAG_VALIDATOR_TEAM: ${FLAG_VALIDATOR_TEAM}
      PCAP_OVER_IP: ${PCAP_OVER_IP}
      DUMP_PCAPS: ${DUMP_PCAPS}
      DUMP_PCAPS_INTERVAL: ${DUMP_PCAPS_INTERVAL}
      DUMP_PCAPS_FILENAME: ${DUMP_PCAPS_FILENAME}
      BPF: ${BPF}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  enricher:
    profiles: ["iris"]
    build:
      context: services/go-importer
      dockerfile: Dockerfile-enricher
    image: iris-enricher:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${SURICATA_DIR_HOST}/log:/suricata:ro
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    # Glob so the enricher picks up either the single all-in-one eve.json
    # or N hostname-tagged eve-<vulnbox>.json files in split mode - both
    # files match `eve*.json`.
    command: "./enricher -eve /suricata/eve*.json"
    environment:
      TIMESCALE: ${TIMESCALE}
      EMIT_SID_TAGS: ${EMIT_SID_TAGS}

  # --- Suricata (IDS mode: offline pcap reader) -----------------------------
  suricata:
    <<: *suricata-common
    profiles: ["suricata-ids"]
    environment:
      SURICATA_UPDATE_ENABLE: ${SURICATA_UPDATE_ENABLE}
      SURICATA_OPTIONS: "-l /var/log/suricata -v -r ${TRAFFIC_DIR_DOCKER} --pcap-file-continuous"

  # --- Suricata (IPS mode: inline on host network via NFQUEUE) --------------
  # Runs with host networking and NET_ADMIN/NET_RAW so it can receive queued
  # packets. Requires the iptables-init container to install the NFQUEUE jump.
  suricata-ips:
    <<: *suricata-common
    profiles: ["suricata-ips"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Override the common volumes to mount the traffic dir rw, so Suricata's
    # pcap-log output can drop rotating pcaps where the assembler reads them.
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:rw
      - ${SURICATA_DIR_HOST}/log:/var/log/suricata
      - ${SURICATA_DIR_HOST}/etc:/etc/suricata
      - ${SURICATA_DIR_HOST}/lib:/var/lib/suricata
      - suricata-control:/run/suricata
    depends_on:
      iptables-init:
        condition: service_completed_successfully
    environment:
      SURICATA_UPDATE_ENABLE: ${SURICATA_UPDATE_ENABLE}
      SURICATA_OPTIONS: "-l /var/log/suricata -v -q ${NFQUEUE_NUM}"

  # One-shot init container that installs `-j NFQUEUE` on the host's iptables.
  iptables-init:
    profiles: ["suricata-ips"]
    image: iris-suricata:latest
    build:
      context: suricata
    restart: "no"
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./suricata/iptables-init.sh:/usr/local/bin/iptables-init.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/iptables-init.sh"]
    environment:
      NFQUEUE_NUM: ${NFQUEUE_NUM}
      NFQUEUE_IFACE: ${NFQUEUE_IFACE}
      NFQUEUE_CHAINS: ${NFQUEUE_CHAINS}
      NFQUEUE_IPV6: ${NFQUEUE_IPV6}

  # --- Vulnbox-side shipper (split-mode deployments) ------------------------
  # Runs on the vulnbox alongside suricata-ips. Rsyncs eve.json and rotating
  # pcaps to the analysis box where the iris profile runs, and pulls the
  # canonical local.rules from the analysis box's api so rule edits made in
  # the Settings UI propagate to every vulnbox.
  shipper:
    profiles: ["vulnbox-agent"]
    build:
      context: vulnbox-agent
    image: iris-shipper:latest
    restart: unless-stopped
    # hostname inside the container drives the upload tag (eve-<host>.json
    # etc.). Default to the host's hostname so multi-vulnbox deployments
    # don't collide on shared rsync targets.
    hostname: ${VULNBOX_HOSTNAME:-vulnbox}
    volumes:
      - ${SURICATA_DIR_HOST}/log:/suricata/log:ro
      - ${TRAFFIC_DIR_HOST}:/traffic:ro
      - ${VULNBOX_SSH_KEY:-./vulnbox-agent/id_ed25519}:/keys/id_ed25519:ro
      # rules-puller writes here on change; suricata-ips reads from the
      # same path.
      - ${SURICATA_DIR_HOST}/lib/rules:/var/lib/suricata/rules:rw
      # control socket for `reload-rules` after we drop new rules.
      - suricata-control:/run/suricata
    environment:
      VULNBOX_SSH_DEST: ${VULNBOX_SSH_DEST}
      VULNBOX_HOSTNAME: ${VULNBOX_HOSTNAME:-}
      SHIP_INTERVAL: ${SHIP_INTERVAL}
      IRIS_API_BASE: ${IRIS_API_BASE:-}
      IRIS_ADMIN_USER: ${IRIS_ADMIN_USER:-admin}
      IRIS_ADMIN_PASS: ${IRIS_ADMIN_PASS:-}
      PULL_INTERVAL: ${PULL_INTERVAL:-10}

volumes:
  timescale-data:
  suricata-control:

networks:
  internal:
