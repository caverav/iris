# DEPRECATED: Suricata is now part of the main docker-compose.yml via profiles.
#
#   docker compose --profile iris --profile suricata-ids up -d --build   # old behaviour
#   docker compose --profile iris --profile suricata-ips up -d --build   # NEW: inline IPS
#
# COMPOSE_PROFILES in .env controls the default. See README.md.
#
# This file is kept for one release so users who pinned it get a clear error
# instead of a stale stack. It will be removed in a future release.

services:
  deprecated-suricata-compose:
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        echo "docker-compose-suricata.yml is deprecated."
        echo "Use: docker compose --profile iris --profile suricata-ids up"
        echo "Or:  docker compose --profile iris --profile suricata-ips up"
        exit 1
